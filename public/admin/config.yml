backend:
  name: github
  repo: thump76/theinteractivedesigner
  branch: main
  base_url: https://tid-cms-auth.philipbrumpton.workers.dev
  auth_endpoint: auth

# Images land here in the repo...
media_folder: public/images/uploads
# ...and are referenced by this path in the built site.
public_folder: /images/uploads

publish_mode: simple
site_url: https://theinteractivedesigner.co.uk

collections:
  - name: posts
    label: Posts
    label_singular: Post
    folder: src/content/posts
    create: true
    slug: '{{slug}}'   # URL comes from the headline, e.g. /hidden-in-plain-sight/
    extension: md
    format: frontmatter
    summary: '{{title}}'
    sortable_fields: [date, title]
    view_filters:
      - label: Drafts
        field: draft
        pattern: true

    fields:
      - label: Headline
        name: title
        widget: string
        hint: Keep it under about 60 characters so it doesn't wrap awkwardly.

      - label: Date
        name: date
        widget: datetime
        format: 'YYYY-MM-DD'      # how it's stored — leave this alone
        date_format: 'DD/MM/YYYY' # how you see it in the editor
        time_format: false
        picker_utc: false

      - label: Standfirst
        name: standfirst
        widget: text
        required: false
        hint: One or two sentences. Shows on the archive, in search results, and as the LinkedIn preview.

      - label: Feature image
        name: image
        widget: image
        required: false
        choose_url: false
        media_library:
          config:
            max_file_size: 2000000

      - label: Image description
        name: imageAlt
        widget: string
        required: false
        hint: What's in the picture. Needed for screen readers and helps search.

      - label: Link
        name: link
        widget: string
        required: false
        pattern: ['^https?://', 'Must start with http:// or https://']
        hint: Optional. Appears at the foot of the post.

      - label: Link label
        name: linkLabel
        widget: string
        required: false
        default: Related
        hint: The heading above the link, e.g. "Product" or "Source".

      - label: Post to LinkedIn
        name: linkedin
        widget: boolean
        default: false
        hint: >-
          Off by default. Tick this and the post joins the LinkedIn queue the
          next time the site builds. Leave it off to publish to the site only.
          You can tick it on an old post later and it will still go out.

      - label: Draft
        name: draft
        widget: boolean
        default: false
        hint: Drafts are saved to the repo but left out of the site and the RSS feed.

      - label: Body
        name: body
        widget: markdown
        hint: Bold, italic, headings, lists, quotes and images. This is the whole post.

  - name: press
    label: Press releases
    label_singular: Press release
    folder: src/content/press
    create: true
    slug: '{{slug}}'   # URL is /press/<slug>/
    extension: md
    format: frontmatter
    summary: '{{subject}}: {{headline}}'
    sortable_fields: [date, subject]
    view_filters:
      - label: Drafts
        field: draft
        pattern: true

    fields:
      - label: Headline
        name: headline
        widget: string
        hint: The news, in one line. Written like a newspaper headline.

      - label: Product name
        name: subject
        widget: string

      - label: Type
        name: kind
        widget: select
        options: [App, Website, Shop, Hardware]

      - label: Standfirst
        name: standfirst
        widget: text
        hint: One or two sentences. Shows on /press/ and as the search and social preview.

      - label: Date
        name: date
        widget: datetime
        format: 'YYYY-MM-DD'
        date_format: 'DD/MM/YYYY'
        time_format: false
        picker_utc: false
        hint: Never shown on the page. Used to order releases and for Google.

      - label: Lead image
        name: image
        widget: image
        required: false
        choose_url: false
        hint: Used as supplied, never cropped.

      - label: Image description
        name: imageAlt
        widget: string
        required: false

      - label: Icon or logo
        name: icon
        widget: image
        required: false
        choose_url: false
        hint: Shown on /press/ when there is no lead image.

      - label: Website
        name: website
        widget: string
        required: false
        pattern: ['^https?://', 'Must start with http:// or https://']

      - label: App Store link
        name: appStore
        widget: string
        required: false
        pattern: ['^https?://', 'Must start with http:// or https://']

      - label: Press contact email
        name: contact
        widget: string
        required: false
        hint: Leave blank to use philipbrumpton@gmail.com.

      - label: Key facts
        name: facts
        widget: list
        required: false
        summary: '{{fields.label}}'
        fields:
          - { label: Label, name: label, widget: string }
          - { label: Value, name: value, widget: text }

      - label: Notes to editors
        name: notes
        widget: list
        required: false
        field: { label: Note, name: note, widget: text }
        hint: The images-on-request note is added automatically.

      - label: Draft
        name: draft
        widget: boolean
        default: false

      - label: Release text
        name: body
        widget: markdown
        hint: Third person. Quotes as block quotes, with the attribution as a second paragraph inside the quote. "Ends" is added automatically.
